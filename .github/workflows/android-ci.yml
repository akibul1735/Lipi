name: Android CI & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Test & Publish to GitHub Releases
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Restore Keystores & Environment
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "android" -keypass "android" -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          elif [ -f "my-upload-key.jks" ]; then
            echo "Found existing my-upload-key.jks..."
          else
            echo "Generating release signing key for CI..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "android" -keypass "android" -dname "CN=Lipi, OU=Lipi, O=Lipi, L=Dhaka, C=BD"
          fi

      - name: Build Android Release APK
        run: |
          STORE_PWD="${{ secrets.STORE_PASSWORD }}"
          [ -z "$STORE_PWD" ] && STORE_PWD="android"
          KEY_PWD="${{ secrets.KEY_PASSWORD }}"
          [ -z "$KEY_PWD" ] && KEY_PWD="android"

          export STORE_PASSWORD="$STORE_PWD"
          export KEY_PASSWORD="$KEY_PWD"
          export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-upload-key.jks"

          echo "Building Release APK..."
          ./gradlew assembleRelease --no-daemon --stacktrace

          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android Build Tools at: $BUILD_TOOLS_DIR"

          INPUT_APK=""
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            INPUT_APK="app/build/outputs/apk/release/app-release.apk"
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            INPUT_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi

          if [ -z "$INPUT_APK" ]; then
            echo "ERROR: Release APK not generated!"
            exit 1
          fi

          echo "Aligning APK with zipalign..."
          $BUILD_TOOLS_DIR/zipalign -p -f 4 "$INPUT_APK" Lipi-Aligned.apk
          $BUILD_TOOLS_DIR/zipalign -c -v 4 Lipi-Aligned.apk || true

          echo "Signing APK with apksigner (v1, v2, v3)..."
          $BUILD_TOOLS_DIR/apksigner sign --ks my-upload-key.jks --ks-key-alias upload \
            --ks-pass pass:"$STORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out Lipi-Release.apk Lipi-Aligned.apk

          rm -f Lipi-Aligned.apk

      - name: Verify APK Signatures & Alignment
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "=== Verifying Lipi-Release.apk ==="
          $BUILD_TOOLS_DIR/apksigner verify --verbose Lipi-Release.apk
          $BUILD_TOOLS_DIR/zipalign -c -v 4 Lipi-Release.apk

      - name: Upload Release APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lipi-Release-APK
          path: Lipi-Release.apk
          retention-days: 14

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          echo "VERSION=v${VERSION}" >> $GITHUB_ENV
          echo "Detected version: v${VERSION}"

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || env.VERSION }}
          name: Lipi (লিপি) ${{ github.ref_type == 'tag' && github.ref_name || env.VERSION }}
          files: |
            Lipi-Release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
